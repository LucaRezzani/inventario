<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario</title>
<meta name="description" content="Il tuo inventario personale: categorie, quantità e soglie di scorta minima. I dati restano sul tuo dispositivo.">
<meta name="theme-color" content="#E9ECEF">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ------------------------------------------------------------------ *
 *  Vocabolario visivo: pannello di macchina industriale.
 *  Il grigio è la struttura, il nero è il contenuto, e i due colori
 *  saturi hanno un significato preciso e uno solo:
 *    giallo = agisci  (il pulsante Aggiungi)
 *    rosso  = allarme (scorta esaurita)
 * ------------------------------------------------------------------ */

:root{
  --paper:#E9ECEF; --surface:#fff; --ink:#161C24; --ink-2:#5C6773;
  --rule:#D6DCE2; --steel:#8B97A4;
  --signal:#F2B705; --signal-dark:#D9A303;
  --alarm:#BE2F27; --alarm-bg:#FAEDEC; --alarm-rule:#E9C6C2;
  --sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh; color:var(--ink); font-family:var(--sans);
  background-color:var(--paper);
  background-image:linear-gradient(to right,rgba(22,28,36,.05) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(22,28,36,.05) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hidden{display:none!important}

.shell{max-width:580px;margin:0 auto;padding:0 14px 190px}

/* testata */
.hdr{padding:26px 2px 14px}
.hdr-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.title{font-family:var(--cond);font-weight:700;font-size:38px;line-height:.92;
  text-transform:uppercase;letter-spacing:.015em;margin:0}
.ghost-btn{font-family:var(--cond);font-weight:600;font-size:13px;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-2);padding:6px 10px;border:1px solid var(--rule);background:var(--surface)}
.ghost-btn:hover{color:var(--ink);border-color:var(--steel)}
.tally{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--mono);
  font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.tally b{font-weight:500;color:var(--ink)}
.tally .warn{color:var(--alarm);font-weight:600}
.tally .sep{width:4px;height:4px;background:var(--steel)}
.searchbar{margin-top:14px;display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--rule);padding:0 12px;height:44px}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;
  font-family:var(--sans);font-size:16px;color:var(--ink)}
.searchbar input::placeholder{color:var(--steel)}
.searchbar svg{color:var(--steel);flex:none}

/* categorie */
.cat{margin-top:26px}
.cat-hd{display:flex;align-items:center;gap:10px;padding:0 2px 7px}
.cat-name{font-family:var(--cond);font-weight:600;font-size:14px;text-transform:uppercase;
  letter-spacing:.16em;white-space:nowrap}
.cat-line{flex:1;height:1px;background:var(--rule)}
.cat-count{font-family:var(--mono);font-size:11px;color:var(--steel);letter-spacing:.05em}
.cat-edit{font-family:var(--cond);font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--steel);padding:2px 4px}
.cat-edit:hover{color:var(--ink)}
.stack{border:1px solid var(--rule);background:var(--surface)}

/* riga oggetto */
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row.alarm{background:var(--alarm-bg);border-bottom-color:var(--alarm-rule)}
.row-main{flex:1;min-width:0;text-align:left;padding:11px 4px 12px 14px}
.row-name{font-size:15px;font-weight:500;line-height:1.25;word-break:break-word}
.row.alarm .row-name{color:var(--alarm)}
/* barra di livello: riempimento proporzionale, tacca sulla soglia */
.gauge{position:relative;height:3px;max-width:190px;margin-top:9px;background:rgba(22,28,36,.10)}
.gauge-fill{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.gauge-tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.row.alarm .gauge{background:rgba(190,47,39,.16)}
.row.alarm .gauge-fill,.row.alarm .gauge-tick{background:var(--alarm)}
.row-meta{margin-top:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--steel)}
.row.alarm .row-meta{color:var(--alarm);font-weight:500}
.stepper{display:flex;align-items:center;padding-right:8px}
.step-btn{width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid transparent}
.step-btn:hover{color:var(--ink);border-color:var(--rule);background:var(--paper)}
.step-btn[disabled]{color:#C3CAD1;cursor:default}
.step-btn[disabled]:hover{background:none;border-color:transparent}
.qty{font-family:var(--mono);font-weight:500;font-size:17px;min-width:42px;text-align:center;
  font-variant-numeric:tabular-nums}
.row.alarm .qty{color:var(--alarm);font-weight:600}

/* stato vuoto */
.empty{margin-top:26px;padding:34px 22px;border:1px dashed var(--steel);
  background:var(--surface);text-align:center}
.empty h3{margin:0 0 8px;font-family:var(--cond);font-weight:600;font-size:19px;
  text-transform:uppercase;letter-spacing:.1em}
.empty p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.55}

/* pulsante Aggiungi */
.fab-wrap{position:fixed;z-index:40;right:max(18px,calc(50vw - 272px));
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fab-row{display:flex;align-items:center;gap:12px}
.fab-tag{font-family:var(--cond);font-weight:700;font-size:14px;text-transform:uppercase;
  letter-spacing:.16em;color:var(--ink);background:var(--surface);border:2px solid var(--ink);
  padding:7px 11px;box-shadow:3px 3px 0 var(--ink)}
.fab{position:relative;width:70px;height:70px;display:grid;place-items:center;
  background:var(--signal);color:var(--ink);border:2px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.fab:hover{background:var(--signal-dark);transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--ink)}
.fab:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.fab.open{transform:rotate(45deg);box-shadow:4px 4px 0 var(--ink)}
.fab.open:hover{transform:rotate(45deg)}
/* alone di richiamo, solo a inventario vuoto */
.fab.calling::after{content:'';position:absolute;inset:-6px;border:2px solid var(--signal);
  animation:halo 2s ease-out infinite;pointer-events:none}
@keyframes halo{0%{opacity:.9;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.28)}}
.fab-item{display:flex;align-items:center;gap:10px;animation:rise .16s ease both}
.fab-item span{font-family:var(--cond);font-weight:600;font-size:13px;text-transform:uppercase;
  letter-spacing:.12em;background:var(--ink);color:#fff;padding:5px 9px}
.fab-item button{width:48px;height:48px;display:grid;place-items:center;background:var(--surface);
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.fab-item button:hover{background:var(--signal)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(22,28,36,.45)}

/* pannelli */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:580px;max-height:88vh;overflow-y:auto;background:var(--surface);
  border:2px solid var(--ink);border-bottom:0;animation:slide .2s ease both}
@keyframes slide{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet-hd{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 12px;background:var(--surface);border-bottom:1px solid var(--rule)}
.sheet-title{font-family:var(--cond);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.09em}
.sheet-body{display:flex;flex-direction:column;gap:16px;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-family:var(--cond);font-weight:600;font-size:12.5px;text-transform:uppercase;
  letter-spacing:.14em;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.hint code{font-family:var(--mono);font-size:11.5px;background:var(--paper);padding:1px 4px}
.inp,.sel,.ta{width:100%;padding:10px 12px;border:1px solid var(--rule);background:var(--surface);
  font-family:var(--sans);font-size:16px;color:var(--ink);outline:none}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--ink)}
.ta{min-height:150px;resize:vertical;font-family:var(--mono);font-size:13.5px;line-height:1.7}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;border:1px solid var(--rule)}
.seg button{flex:1;padding:9px 8px;font-family:var(--cond);font-weight:600;font-size:13px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink);color:#fff}
.preview{max-height:190px;overflow-y:auto;border:1px solid var(--rule)}
.pv-row{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;
  border-bottom:1px solid var(--rule);font-size:13.5px}
.pv-row:last-child{border-bottom:0}
.pv-right{display:flex;align-items:center;gap:10px}
.pv-tag{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--steel);white-space:nowrap}
.pv-row .num{font-size:13.5px}
.actions{display:flex;gap:10px;padding-top:2px}
.btn-primary{flex:1;padding:13px;background:var(--ink);color:#fff;font-family:var(--cond);
  font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.12em}
.btn-primary[disabled]{background:var(--steel);cursor:default}
.btn-danger{padding:13px 15px;border:1px solid var(--alarm);color:var(--alarm);font-family:var(--cond);
  font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.12em}
.btn-danger:hover{background:var(--alarm-bg)}
.notice{padding:9px 11px;border:1px solid var(--alarm-rule);background:var(--alarm-bg);
  color:var(--alarm);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;line-height:1.6}

@media(max-width:380px){.title{font-size:32px}.fab-tag{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<body>

<div class="shell">
  <header class="hdr">
    <div class="hdr-row">
      <h1 class="title">Inventario</h1>
      <button class="ghost-btn" id="btn-dati">Dati</button>
    </div>
    <div class="tally" id="tally"></div>
    <div class="searchbar">
      <span id="ico-search"></span>
      <input id="search" placeholder="Cerca un oggetto" aria-label="Cerca un oggetto">
      <button id="clear-search" class="hidden" aria-label="Azzera la ricerca"></button>
    </div>
    <div class="notice hidden" id="storage-warn" style="margin-top:14px">
      Salvataggio non disponibile su questo browser: le modifiche restano solo in questa sessione.
      Esporta i dati dal pannello «Dati» prima di chiudere.
    </div>
  </header>

  <main id="list"></main>
</div>

<div class="scrim hidden" id="fab-scrim"></div>
<div class="fab-wrap">
  <div id="fab-menu"></div>
  <div class="fab-row">
    <span class="fab-tag" id="fab-tag">Aggiungi</span>
    <button class="fab" id="fab" aria-expanded="false" aria-label="Aggiungi"></button>
  </div>
</div>

<div id="sheet-host"></div>

<script>
'use strict';

/* ================================================================== *
 *  1. Icone
 * ================================================================== */

const PATHS = {
  plus:   '<path d="M12 5v14M5 12h14"/>',
  minus:  '<path d="M5 12h14"/>',
  x:      '<path d="M18 6 6 18M6 6l12 12"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4-4"/>',
  trash:  '<path d="M3.5 6h17M9 6V3.8h6V6M6.5 6l1 14.2h9l1-14.2"/>',
  box:    '<path d="M3.5 7.8 12 3.6l8.5 4.2v8.4L12 20.4l-8.5-4.2z"/><path d="m3.5 7.8 8.5 4.2 8.5-4.2M12 12v8.4"/>',
  folder: '<path d="M3.5 6.5h5.6l1.9 2h9.5v9.8h-17z"/><path d="M12 11.5v4.5M9.75 13.75h4.5"/>',
  list:   '<path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M3.6 6.5h.01M3.6 12h.01M3.6 17.5h.01"/>'
};

function icon(name, size = 20, sw = 1.7) {
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" ' +
    'stroke="currentColor" stroke-width="' + sw + '" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' + PATHS[name] + '</svg>';
}

/* ================================================================== *
 *  2. Utility
 * ================================================================== */

const $  = (sel, root) => (root || document).querySelector(sel);
const UNCAT = '__uncat__';

/** Crea un elemento a partire da una stringa HTML. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/** Neutralizza l'HTML nei testi inseriti dall'utente. Da usare SEMPRE sui nomi. */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const uid = () =>
  Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

/** Confronto alfabetico italiano: ignora maiuscole e accenti, ordina i numeri come numeri. */
const collator = new Intl.Collator('it', { sensitivity: 'base', numeric: true });

/** Forma canonica di un nome, per riconoscere "Caffè" e "caffe" come lo stesso oggetto. */
const norm = (s) =>
  String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

/** Numero leggibile: interi puliti, decimali con la virgola. */
function fmt(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return Number.isInteger(n) ? String(n) : String(Number(n.toFixed(2))).replace('.', ',');
}

/** Legge un numero accettando sia la virgola sia il punto. */
function toNum(s) {
  const n = parseFloat(String(s).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}

const round2 = (n) => Math.round(n * 100) / 100;

/** Un oggetto è sotto scorta quando ha una soglia e la quantità l'ha raggiunta. */
const isLow = (it) => it.min !== null && it.min !== undefined && it.qty <= it.min;

/* ================================================================== *
 *  3. Persistenza
 *
 *  localStorage sa memorizzare solo stringhe, quindi l'oggetto va
 *  convertito con JSON.stringify e riletto con JSON.parse.
 *  Questo è l'unico punto dell'app che tocca la memoria: per passare
 *  un giorno a un server, si riscrivono solo load() e save().
 * ================================================================== */

const KEY = 'inventario:v1';

let state = { version: 1, categories: [], items: [] };
let storageOk = true;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    state = {
      version: 1,
      categories: Array.isArray(parsed.categories) ? parsed.categories : [],
      items: Array.isArray(parsed.items) ? parsed.items : []
    };
  } catch (e) {
    storageOk = false;
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    // Spazio esaurito, oppure storage bloccato (navigazione privata su alcuni browser).
    storageOk = false;
    $('#storage-warn').classList.remove('hidden');
  }
}

/** Salva e ridisegna: da chiamare dopo ogni modifica. */
function commit() {
  save();
  render();
}

/* ================================================================== *
 *  4. Lettura dei dati
 * ================================================================== */

function categoryName(id) {
  const c = state.categories.find((c) => c.id === id);
  return c ? c.name : 'Senza categoria';
}

/** Categorie in ordine alfabetico, con gli oggetti a loro volta in ordine alfabetico. */
function buildGroups(query) {
  const needle = norm(query);
  const visible = needle
    ? state.items.filter((i) => norm(i.name).indexOf(needle) !== -1)
    : state.items;

  const byCat = new Map();
  visible.forEach((it) => {
    const known = state.categories.some((c) => c.id === it.catId);
    const cid = known ? it.catId : UNCAT;
    if (!byCat.has(cid)) byCat.set(cid, []);
    byCat.get(cid).push(it);
  });

  const out = [];
  byCat.forEach((items, id) => {
    out.push({
      id: id,
      name: id === UNCAT ? 'Senza categoria' : categoryName(id),
      items: items.slice().sort((a, b) => collator.compare(a.name, b.name))
    });
  });

  out.sort((a, b) => {
    if (a.id === UNCAT) return 1;
    if (b.id === UNCAT) return -1;
    return collator.compare(a.name, b.name);
  });
  return out;
}

function sortedCategories() {
  return state.categories.slice().sort((a, b) => collator.compare(a.name, b.name));
}

/* ================================================================== *
 *  5. Modifiche ai dati
 * ================================================================== */

function bump(id, delta) {
  const it = state.items.find((i) => i.id === id);
  if (!it) return;
  it.qty = Math.max(0, round2(it.qty + delta));
  commit();
}

function upsertItem(item) {
  const i = state.items.findIndex((x) => x.id === item.id);
  if (i >= 0) state.items[i] = item;
  else state.items.push(item);
  commit();
}

function removeItem(id) {
  state.items = state.items.filter((i) => i.id !== id);
  commit();
}

/** Crea la categoria e restituisce subito il suo id. */
function addCategory(name) {
  const id = uid();
  state.categories.push({ id: id, name: String(name).trim() });
  return id;
}

function renameCategory(id, name) {
  const c = state.categories.find((c) => c.id === id);
  if (c) c.name = String(name).trim();
  commit();
}

/** Elimina la categoria ma conserva gli oggetti, che passano a "Senza categoria". */
function removeCategory(id) {
  state.categories = state.categories.filter((c) => c.id !== id);
  state.items.forEach((i) => { if (i.catId === id) i.catId = UNCAT; });
  commit();
}

/**
 * Applica una lista a una categoria.
 *   mode 'sum'  somma alle quantità esistenti (rifornimento)
 *   mode 'set'  sostituisce le quantità (conteggio da zero)
 */
function applyList(catId, rows, mode) {
  rows.forEach((r) => {
    const idx = state.items.findIndex(
      (i) => i.catId === catId && norm(i.name) === norm(r.name)
    );
    if (idx >= 0) {
      const prev = state.items[idx];
      prev.qty = mode === 'sum' ? round2(prev.qty + r.qty) : r.qty;
      if (r.min !== null) prev.min = r.min;
    } else {
      state.items.push({
        id: uid(), name: String(r.name).trim(), qty: r.qty, min: r.min, catId: catId
      });
    }
  });
  commit();
}

/* ================================================================== *
 *  6. Lettura delle liste testuali
 *
 *    "Passata di pomodoro 6" -> { name:'Passata di pomodoro', qty:6, min:null }
 *    "Olio EVO 3 / 1"        -> { name:'Olio EVO',            qty:3, min:1 }
 *    "Farina 00 4"           -> { name:'Farina 00',           qty:4, min:null }
 *    "Sale"                  -> { name:'Sale',                qty:1, min:null }
 *
 *  Il nome è avido: prende tutto fino all'ultimo numero della riga, così
 *  "Farina 00 4" non diventa "Farina" con quantità 0 e minimo 4.
 * ================================================================== */

const NUM = '\\d+(?:[.,]\\d+)?';

function parseLine(raw) {
  const line = String(raw).trim();
  if (!line) return null;

  let m = line.match(new RegExp('^(.*\\S)\\s*[\\/|]\\s*(' + NUM + ')\\s*$'));
  if (m) {
    const head = m[1];
    const min = toNum(m[2]);
    const m2 = head.match(new RegExp('^(.*\\S)\\s+(' + NUM + ')\\s*$'));
    if (m2) return { name: m2[1], qty: toNum(m2[2]), min: min };
    return { name: head, qty: 1, min: min };
  }

  m = line.match(new RegExp('^(.*\\S)\\s+(' + NUM + ')\\s*$'));
  if (m) return { name: m[1], qty: toNum(m[2]), min: null };

  return { name: line, qty: 1, min: null };
}

function parseList(text) {
  return String(text).split('\n').map(parseLine).filter(Boolean);
}

/* ================================================================== *
 *  7. Disegno della pagina
 * ================================================================== */

let query = '';

function render() {
  renderTally();
  renderList();
  const empty = state.items.length === 0;
  $('#fab').classList.toggle('calling', empty && !fabOpen);
}

function renderTally() {
  const low = state.items.filter(isLow).length;
  let html =
    '<span><b>' + state.items.length + '</b> voci</span>' +
    '<span class="sep"></span>' +
    '<span><b>' + state.categories.length + '</b> categorie</span>';
  if (low > 0) {
    html += '<span class="sep"></span><span class="warn">' + low + ' sotto scorta</span>';
  }
  $('#tally').innerHTML = html;
}

function rowHTML(it) {
  const low = isLow(it);
  const hasMin = it.min !== null && it.min !== undefined;

  let gauge = '';
  if (hasMin) {
    // Scala normalizzata: la tacca sta al centro finché la scorta è sana.
    const scale = Math.max(it.min * 2, it.qty, 1);
    const fill = Math.min(100, (it.qty / scale) * 100);
    const tick = (it.min / scale) * 100;
    gauge =
      '<div class="gauge" aria-hidden="true">' +
        '<span class="gauge-fill" style="width:' + fill + '%"></span>' +
        '<span class="gauge-tick" style="left:' + tick + '%"></span>' +
      '</div>' +
      '<div class="row-meta">' + (low ? 'Sotto scorta · ' : '') + 'minimo ' + fmt(it.min) + '</div>';
  }

  return '' +
    '<div class="row' + (low ? ' alarm' : '') + '">' +
      '<button class="row-main" data-act="edit" data-id="' + it.id + '">' +
        '<div class="row-name">' + esc(it.name) + '</div>' + gauge +
      '</button>' +
      '<div class="stepper">' +
        '<button class="step-btn" data-act="dec" data-id="' + it.id + '"' +
          (it.qty <= 0 ? ' disabled' : '') +
          ' aria-label="Togli uno da ' + esc(it.name) + '">' + icon('minus', 17, 1.6) + '</button>' +
        '<span class="qty">' + fmt(it.qty) + '</span>' +
        '<button class="step-btn" data-act="inc" data-id="' + it.id + '"' +
          ' aria-label="Aggiungi uno a ' + esc(it.name) + '">' + icon('plus', 17, 1.6) + '</button>' +
      '</div>' +
    '</div>';
}

function renderList() {
  const groups = buildGroups(query);
  const host = $('#list');

  if (groups.length === 0) {
    host.innerHTML =
      '<div class="empty">' +
        '<h3>' + (query ? 'Nessun risultato' : 'Inventario vuoto') + '</h3>' +
        '<p>' + (query
          ? 'Nessun oggetto contiene «' + esc(query) + '».'
          : 'Tocca Aggiungi, in basso a destra, per inserire il primo oggetto, una categoria o un\u2019intera lista.') +
        '</p>' +
      '</div>';
    return;
  }

  host.innerHTML = groups.map((g) =>
    '<section class="cat">' +
      '<div class="cat-hd">' +
        '<span class="cat-name">' + esc(g.name) + '</span>' +
        '<span class="cat-line"></span>' +
        '<span class="cat-count">' + String(g.items.length).padStart(2, '0') + '</span>' +
        (g.id !== UNCAT
          ? '<button class="cat-edit" data-act="cat" data-id="' + g.id + '">Modifica</button>'
          : '') +
      '</div>' +
      '<div class="stack">' + g.items.map(rowHTML).join('') + '</div>' +
    '</section>'
  ).join('');
}

/* Un solo ascoltatore per tutta la lista: i pulsanti dicono cosa fare
   tramite data-act, così non serve riagganciare gli eventi a ogni disegno. */
$('#list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  if (act === 'inc') bump(id, 1);
  else if (act === 'dec') bump(id, -1);
  else if (act === 'edit') openItemSheet(state.items.find((i) => i.id === id));
  else if (act === 'cat') openCategorySheet(state.categories.find((c) => c.id === id));
});

/* ================================================================== *
 *  8. Ricerca
 * ================================================================== */

$('#ico-search').innerHTML = icon('search', 17, 1.5);
$('#clear-search').innerHTML = icon('x', 16, 1.5);

$('#search').addEventListener('input', (e) => {
  query = e.target.value;
  $('#clear-search').classList.toggle('hidden', !query);
  renderList();
});

$('#clear-search').addEventListener('click', () => {
  query = '';
  $('#search').value = '';
  $('#clear-search').classList.add('hidden');
  renderList();
});

/* ================================================================== *
 *  9. Pulsante Aggiungi
 * ================================================================== */

let fabOpen = false;

const VOICES = [
  { key: 'list',     label: 'Lista',     ico: 'list' },
  { key: 'category', label: 'Categoria', ico: 'folder' },
  { key: 'item',     label: 'Oggetto',   ico: 'box' }
];

$('#fab').innerHTML = icon('plus', 34, 2.4);

function setFab(open) {
  fabOpen = open;
  const fab = $('#fab');
  fab.classList.toggle('open', open);
  fab.setAttribute('aria-expanded', String(open));
  fab.setAttribute('aria-label', open ? 'Chiudi il menu' : 'Aggiungi');
  fab.classList.toggle('calling', !open && state.items.length === 0);
  $('#fab-tag').classList.toggle('hidden', open);
  $('#fab-scrim').classList.toggle('hidden', !open);

  $('#fab-menu').innerHTML = open
    ? VOICES.map((v, i) =>
        '<div class="fab-item" style="animation-delay:' + i * 40 + 'ms">' +
          '<span>' + v.label + '</span>' +
          '<button data-kind="' + v.key + '" aria-label="Aggiungi ' + v.label.toLowerCase() + '">' +
            icon(v.ico, 21, 1.6) +
          '</button>' +
        '</div>'
      ).join('')
    : '';
}

$('#fab').addEventListener('click', () => setFab(!fabOpen));
$('#fab-scrim').addEventListener('click', () => setFab(false));

$('#fab-menu').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-kind]');
  if (!btn) return;
  setFab(false);
  const kind = btn.dataset.kind;
  if (kind === 'item') openItemSheet(null);
  else if (kind === 'category') openCategorySheet(null);
  else openListSheet();
});

/* ================================================================== *
 *  10. Pannelli
 * ================================================================== */

let escHandler = null;

function closeSheet() {
  $('#sheet-host').innerHTML = '';
  document.body.style.overflow = '';
  if (escHandler) {
    window.removeEventListener('keydown', escHandler);
    escHandler = null;
  }
}

/** Apre un pannello e restituisce il nodo del corpo, dove agganciare gli eventi. */
function openSheet(title, bodyHTML) {
  closeSheet();
  const node = h(
    '<div>' +
      '<div class="scrim"></div>' +
      '<div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        '<div class="sheet">' +
          '<div class="sheet-hd">' +
            '<div class="sheet-title">' + esc(title) + '</div>' +
            '<button data-close aria-label="Chiudi">' + icon('x', 22, 1.5) + '</button>' +
          '</div>' +
          '<div class="sheet-body">' + bodyHTML + '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );

  node.querySelector('.scrim').addEventListener('click', closeSheet);
  node.querySelector('[data-close]').addEventListener('click', closeSheet);
  node.querySelector('.sheet-wrap').addEventListener('click', (e) => {
    if (e.target.classList.contains('sheet-wrap')) closeSheet();
  });

  escHandler = (e) => { if (e.key === 'Escape') closeSheet(); };
  window.addEventListener('keydown', escHandler);

  document.body.style.overflow = 'hidden';
  $('#sheet-host').appendChild(node);
  return node.querySelector('.sheet-body');
}

/** Select delle categorie, con la voce per crearne una al volo. */
function categoryPickerHTML(id, selected) {
  const opts = sortedCategories()
    .map((c) => '<option value="' + c.id + '"' + (c.id === selected ? ' selected' : '') + '>' +
      esc(c.name) + '</option>').join('');
  return '' +
    '<div class="field">' +
      '<label class="label" for="' + id + '">Categoria</label>' +
      '<select id="' + id + '" class="sel">' + opts +
        '<option value="' + UNCAT + '"' + (selected === UNCAT ? ' selected' : '') + '>Senza categoria</option>' +
        '<option value="__new__">+ Nuova categoria…</option>' +
      '</select>' +
    '</div>' +
    '<div class="field hidden" id="' + id + '-newwrap">' +
      '<label class="label" for="' + id + '-new">Nome della categoria</label>' +
      '<input id="' + id + '-new" class="inp" placeholder="Es. Dispensa">' +
    '</div>';
}

function wireCategoryPicker(body, id, onChange) {
  const sel = $('#' + id, body);
  const wrap = $('#' + id + '-newwrap', body);
  sel.addEventListener('change', () => {
    wrap.classList.toggle('hidden', sel.value !== '__new__');
    if (onChange) onChange();
  });
}

/** Restituisce l'id di categoria scelto, creandola se l'utente ne ha digitata una nuova. */
function resolveCategory(body, id) {
  const sel = $('#' + id, body);
  if (sel.value !== '__new__') return sel.value;
  const name = $('#' + id + '-new', body).value.trim();
  return name ? addCategory(name) : UNCAT;
}

/* ---------------- pannello oggetto ---------------- */

function openItemSheet(item) {
  const first = sortedCategories()[0];
  const cat = item ? item.catId : (first ? first.id : UNCAT);
  const minVal = item && item.min !== null && item.min !== undefined ? item.min : '';

  const body = openSheet(item ? 'Modifica oggetto' : 'Nuovo oggetto',
    '<div class="field">' +
      '<label class="label" for="it-name">Nome</label>' +
      '<input id="it-name" class="inp" placeholder="Es. Caffè macinato" value="' +
        esc(item ? item.name : '') + '">' +
    '</div>' +
    '<div class="pair">' +
      '<div class="field">' +
        '<label class="label" for="it-qty">Quantità</label>' +
        '<input id="it-qty" class="inp num" inputmode="decimal" value="' +
          (item ? fmt(item.qty) : '1') + '">' +
      '</div>' +
      '<div class="field">' +
        '<label class="label" for="it-min">Scorta minima</label>' +
        '<input id="it-min" class="inp num" inputmode="decimal" placeholder="facoltativa" value="' +
          (minVal === '' ? '' : fmt(minVal)) + '">' +
      '</div>' +
    '</div>' +
    '<div class="hint" style="margin-top:-8px">' +
      'Lascia vuota la scorta minima per non ricevere l\u2019allarme su questo oggetto.' +
    '</div>' +
    categoryPickerHTML('it-cat', cat) +
    '<div class="actions">' +
      '<button class="btn-primary" id="it-save">' + (item ? 'Salva' : 'Aggiungi') + '</button>' +
      (item ? '<button class="btn-danger" id="it-del" aria-label="Elimina oggetto">' +
        icon('trash', 17, 1.6) + '</button>' : '') +
    '</div>'
  );

  wireCategoryPicker(body, 'it-cat');
  $('#it-name', body).focus();

  $('#it-save', body).addEventListener('click', () => {
    const name = $('#it-name', body).value.trim();
    const qty = toNum($('#it-qty', body).value);
    const minRaw = $('#it-min', body).value.trim();
    if (!name || qty === null) return;

    upsertItem({
      id: item ? item.id : uid(),
      name: name,
      qty: Math.max(0, qty),
      // Campo facoltativo: vuoto significa nessuna soglia, quindi nessun allarme.
      min: minRaw === '' ? null : Math.max(0, toNum(minRaw) || 0),
      catId: resolveCategory(body, 'it-cat')
    });
    closeSheet();
  });

  if (item) {
    $('#it-del', body).addEventListener('click', () => {
      removeItem(item.id);
      closeSheet();
    });
  }
}

/* ---------------- pannello categoria ---------------- */

function openCategorySheet(category) {
  const count = category ? state.items.filter((i) => i.catId === category.id).length : 0;

  const body = openSheet(category ? 'Modifica categoria' : 'Nuova categoria',
    '<div class="field">' +
      '<label class="label" for="cat-name">Nome</label>' +
      '<input id="cat-name" class="inp" placeholder="Es. Dispensa" value="' +
        esc(category ? category.name : '') + '">' +
    '</div>' +
    '<div class="notice hidden" id="cat-confirm">' +
      'Elimino «' + esc(category ? category.name : '') + '». I ' + count +
      ' oggetti restano nell\u2019inventario e passano a «Senza categoria».' +
    '</div>' +
    '<div class="actions" id="cat-actions">' +
      '<button class="btn-primary" id="cat-save">' + (category ? 'Salva' : 'Crea') + '</button>' +
      (category ? '<button class="btn-danger" id="cat-del" aria-label="Elimina categoria">' +
        icon('trash', 17, 1.6) + '</button>' : '') +
    '</div>'
  );

  $('#cat-name', body).focus();

  // Quando armed è true, il pannello è in attesa di conferma per l'eliminazione
  // e il pulsante principale diventa "Annulla".
  let armed = false;
  const confirmBox = $('#cat-confirm', body);
  const save = $('#cat-save', body);

  save.addEventListener('click', () => {
    if (armed) {
      armed = false;
      confirmBox.classList.add('hidden');
      save.textContent = 'Salva';
      return;
    }
    const name = $('#cat-name', body).value.trim();
    if (!name) return;
    if (category) renameCategory(category.id, name);
    else { addCategory(name); commit(); }
    closeSheet();
  });

  if (category) {
    // Primo tocco sul cestino: mostra cosa succederà. Secondo tocco: esegue.
    $('#cat-del', body).addEventListener('click', () => {
      if (!armed) {
        armed = true;
        confirmBox.classList.remove('hidden');
        save.textContent = 'Annulla';
        return;
      }
      removeCategory(category.id);
      closeSheet();
    });
  }
}

/* ---------------- pannello lista ---------------- */

const LIST_PLACEHOLDER =
  'Passata di pomodoro 6\nRiso Carnaroli 2\nOlio EVO 3 / 1\nSale grosso';

function openListSheet() {
  const first = sortedCategories()[0];

  const body = openSheet('Aggiungi una lista',
    categoryPickerHTML('ls-cat', first ? first.id : UNCAT) +
    '<div class="field">' +
      '<label class="label" for="ls-text">Elenco</label>' +
      '<textarea id="ls-text" class="ta" placeholder="' + esc(LIST_PLACEHOLDER) + '"></textarea>' +
      '<div class="hint">Un oggetto per riga, nel formato <code>nome quantità</code>. ' +
        'Aggiungi <code>/ minimo</code> per impostare anche la scorta minima. ' +
        'Senza numero la quantità vale 1.</div>' +
    '</div>' +
    '<div class="field">' +
      '<span class="label">Se l\u2019oggetto esiste già</span>' +
      '<div class="seg" id="ls-mode">' +
        '<button class="on" data-mode="sum">Somma</button>' +
        '<button data-mode="set">Sostituisci</button>' +
      '</div>' +
      '<div class="hint">«Somma» per un rifornimento, «Sostituisci» per un conteggio da zero.</div>' +
    '</div>' +
    '<div class="field hidden" id="ls-preview-wrap">' +
      '<span class="label" id="ls-preview-label"></span>' +
      '<div class="preview" id="ls-preview"></div>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn-primary" id="ls-apply" disabled>Aggiungi</button>' +
    '</div>'
  );

  let mode = 'sum';
  let rows = [];

  function refresh() {
    rows = parseList($('#ls-text', body).value);
    const catId = $('#ls-cat', body).value;
    const isNew = catId === '__new__';

    $('#ls-preview-wrap', body).classList.toggle('hidden', rows.length === 0);
    $('#ls-preview-label', body).textContent = 'Anteprima · ' + rows.length + ' righe';

    $('#ls-preview', body).innerHTML = rows.map((r) => {
      const exists = !isNew && state.items.some(
        (i) => i.catId === catId && norm(i.name) === norm(r.name)
      );
      const tag = exists ? (mode === 'sum' ? 'somma' : 'sostituisce') : 'nuovo';
      return '<div class="pv-row">' +
        '<span>' + esc(r.name) + '</span>' +
        '<span class="pv-right">' +
          (r.min !== null ? '<span class="pv-tag">min ' + fmt(r.min) + '</span>' : '') +
          '<span class="pv-tag">' + tag + '</span>' +
          '<span class="num">' + fmt(r.qty) + '</span>' +
        '</span>' +
      '</div>';
    }).join('');

    const btn = $('#ls-apply', body);
    btn.disabled = rows.length === 0;
    btn.textContent = rows.length
      ? 'Aggiungi ' + rows.length + (rows.length === 1 ? ' oggetto' : ' oggetti')
      : 'Aggiungi';
  }

  wireCategoryPicker(body, 'ls-cat', refresh);
  $('#ls-text', body).addEventListener('input', refresh);
  $('#ls-text', body).focus();

  $('#ls-mode', body).addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]');
    if (!b) return;
    mode = b.dataset.mode;
    Array.prototype.forEach.call(
      $('#ls-mode', body).children, (c) => c.classList.toggle('on', c === b)
    );
    refresh();
  });

  $('#ls-apply', body).addEventListener('click', () => {
    if (!rows.length) return;
    applyList(resolveCategory(body, 'ls-cat'), rows, mode);
    closeSheet();
  });

  refresh();
}

/* ---------------- pannello dati ---------------- */

function openDataSheet() {
  const json = JSON.stringify(state, null, 2);

  const body = openSheet('Dati',
    '<div class="seg" id="dt-tabs">' +
      '<button class="on" data-tab="export">Esporta</button>' +
      '<button data-tab="import">Importa</button>' +
    '</div>' +

    '<div id="dt-export">' +
      '<div class="hint" style="margin-bottom:16px">Questo testo è l\u2019intero inventario. ' +
        'Salvalo come copia di sicurezza, oppure incollalo nella scheda «Importa» ' +
        'su un altro dispositivo per ricrearlo identico.</div>' +
      '<textarea class="ta" id="dt-json" readonly></textarea>' +
      '<div class="actions" style="margin-top:16px">' +
        '<button class="btn-primary" id="dt-copy">Copia negli appunti</button>' +
        '<button class="btn-primary" id="dt-down">Scarica file</button>' +
      '</div>' +
    '</div>' +

    '<div id="dt-import" class="hidden">' +
      '<div class="notice" style="margin-bottom:16px">L\u2019importazione sostituisce ' +
        'l\u2019inventario attuale. Esporta prima una copia se ti serve.</div>' +
      '<textarea class="ta" id="dt-paste" placeholder="Incolla qui il JSON esportato"></textarea>' +
      '<div class="actions" style="margin-top:16px">' +
        '<button class="btn-primary" id="dt-import-go">Sostituisci inventario</button>' +
      '</div>' +
    '</div>' +

    '<div class="notice hidden" id="dt-err"></div>'
  );

  // Il JSON va assegnato come valore, non incollato nell'HTML: eviterebbe
  // di dover sfuggire i caratteri e non rischia di rompere il markup.
  $('#dt-json', body).value = json;
  $('#dt-json', body).addEventListener('focus', (e) => e.target.select());

  const err = $('#dt-err', body);
  const fail = (msg) => { err.textContent = msg; err.classList.remove('hidden'); };
  const clearErr = () => err.classList.add('hidden');

  $('#dt-tabs', body).addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    Array.prototype.forEach.call(
      $('#dt-tabs', body).children, (c) => c.classList.toggle('on', c === b)
    );
    $('#dt-export', body).classList.toggle('hidden', b.dataset.tab !== 'export');
    $('#dt-import', body).classList.toggle('hidden', b.dataset.tab !== 'import');
    clearErr();
  });

  $('#dt-copy', body).addEventListener('click', () => {
    const btn = $('#dt-copy', body);
    navigator.clipboard.writeText(json).then(() => {
      btn.textContent = 'Copiato';
      setTimeout(() => { btn.textContent = 'Copia negli appunti'; }, 1600);
    }).catch(() => fail('Copia non riuscita. Seleziona il testo e copialo a mano.'));
  });

  $('#dt-down', body).addEventListener('click', () => {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'inventario-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  $('#dt-import-go', body).addEventListener('click', () => {
    const text = $('#dt-paste', body).value.trim();
    if (!text) return;
    let next;
    try {
      next = JSON.parse(text);
    } catch (e) {
      return fail('Il testo incollato non è JSON valido.');
    }
    if (!Array.isArray(next.items) || !Array.isArray(next.categories)) {
      return fail('Il file non contiene un inventario valido: mancano «items» o «categories».');
    }
    state = { version: 1, categories: next.categories, items: next.items };
    commit();
    closeSheet();
  });
}

$('#btn-dati').addEventListener('click', openDataSheet);

/* ================================================================== *
 *  11. Avvio
 * ================================================================== */

try {
  localStorage.setItem('__probe__', '1');
  localStorage.removeItem('__probe__');
} catch (e) {
  storageOk = false;
}

load();
if (!storageOk) $('#storage-warn').classList.remove('hidden');
setFab(false);
render();

// Service worker: fa funzionare l'app anche senza rete.
// Serve https (o localhost): aprendo il file con doppio clic non si registra.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
